name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Serialize publication so concurrent tags do not race to update latest.
concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'dgddw/artex' }}

jobs:
  verify:
    uses: ./.github/workflows/tests.yml

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate release tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Export the frontend once and reuse it for all five cross-compiled binaries.
  frontend:
    needs: [verify, prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out
          if-no-files-found: error

  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            norma/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # Prefer portability over UPX self-extracting binaries.
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Verify package checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
          if-no-files-found: error
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex
          if-no-files-found: error

  # Build one manifest list containing both native Linux architectures.
  docker:
    needs: [binaries, prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable == 'true' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published multi-architecture manifest
        env:
          TAG: ${{ github.ref_name }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          verify_manifest() {
            docker buildx imagetools inspect "$1" --raw > "$2"
            jq -e \
              '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]' "$2"
          }
          verify_manifest "$DOCKERHUB_IMAGE:$TAG" release-manifest.json
          if [ "$STABLE" = true ]; then
            verify_manifest "$DOCKERHUB_IMAGE:latest" latest-manifest.json
            cmp release-manifest.json latest-manifest.json
          fi
      - name: Smoke test both published Linux images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" --entrypoint /app/artex "$DOCKERHUB_IMAGE:$TAG" -h
          done

  # Publish only after all five packages and the Docker manifest are verified.
  release:
    needs: [binaries, docker, prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version notes from changelog
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Keep automatic notes for tags with no version section yet.
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Verify complete release and generate checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 5
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            test -s "artex-${VERSION}-${target}.zip"
          done
          sha256sum *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.stable == 'true' && 'true' || 'false' }}
          generate_release_notes: true
